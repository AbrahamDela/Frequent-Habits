name: Patch Spanish selector
on:
  push:
    branches: [ spanish-translation ]
    paths:
      - '.github/workflows/patch-spanish-selector.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-translation
      - shell: python
        run: |
          from pathlib import Path
          p=Path('app/src/main/java/com/example/MainActivity.kt')
          s=p.read_text(encoding='utf-8')
          old='options = listOf("Deutsch", "English", "ქართული", "简体中文"),\n                                    selectedIndex = when (language) {\n                                        "de" -> 0\n                                        "en" -> 1\n                                        "ka" -> 2\n                                        "zh" -> 3'
          new='options = listOf("Deutsch", "English", "Español", "ქართული", "简体中文"),\n                                    selectedIndex = when (language) {\n                                        "de" -> 0\n                                        "en" -> 1\n                                        "es" -> 2\n                                        "ka" -> 3\n                                        "zh" -> 4'
          assert old in s, 'Primary language selector block not found'
          s=s.replace(old,new,1)
          old2='"en" to "English 🇬🇧",\n                "de" to "Deutsch 🇩🇪",\n                "ka" to "ქართული 🇬🇪",\n                "zh" to "简体中文 🇨🇳"'
          new2='"en" to "English 🇬🇧",\n                "es" to "Español 🇪🇸",\n                "de" to "Deutsch 🇩🇪",\n                "ka" to "ქართული 🇬🇪",\n                "zh" to "简体中文 🇨🇳"'
          assert old2 in s, 'Secondary language selector block not found'
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
      - shell: python
        run: |
          from pathlib import Path
          p=Path('app/src/main/java/com/example/Translations.kt')
          s=p.read_text(encoding='utf-8')
          s=s.replace('"Add" to "Añadir"','"Add" to "Agregar"')
          s=s.replace('"Habit added!" to "¡Hábito añadido!"','"Habit added!" to "¡Hábito agregado!"')
          p.write_text(s,encoding='utf-8')
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/example/MainActivity.kt app/src/main/java/com/example/Translations.kt
          git commit -m "fix: add Spanish to all language selectors" || true
          git push
