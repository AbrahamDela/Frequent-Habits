name: Spanish translation inspection

on:
  push:
    branches: [ spanish-translation ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-translation
      - name: Inspect selector and untranslated strings
        shell: python
        run: |
          from pathlib import Path
          import re
          roots=[Path('app/src/main/java'), Path('app/src/main/res')]
          files=[]
          for root in roots:
              if root.exists(): files += [p for p in root.rglob('*') if p.is_file() and p.suffix in {'.kt','.xml'}]
          selector=[]; untranslated=[]
          needles=['Deutsch','English','ქართული','简体中文','Language & Region','Language','setLanguage','updateLanguage','languageOptions']
          for p in files:
              try: lines=p.read_text(encoding='utf-8').splitlines()
              except: continue
              for i,line in enumerate(lines):
                  if any(n.lower() in line.lower() for n in needles):
                      a=max(0,i-4); b=min(len(lines),i+5)
                      selector.append(f'--- {p} lines {a+1}-{b} ---\n'+'\n'.join(f'{j+1}: {lines[j]}' for j in range(a,b)))
                  # Flag likely visible English string literals that do not already have an es branch nearby.
                  if p.suffix=='.kt' and re.search(r'"[A-Za-z][A-Za-z0-9 ,.!?&+:/()\-\'’]{2,}"', line):
                      context='\n'.join(lines[max(0,i-2):min(len(lines),i+3)])
                      if 'language == "es"' not in context and 'tr("es"' not in context:
                          untranslated.append(f'{p}:{i+1}: {line.strip()}')
          Path('LANGUAGE_SELECTOR_REPORT.txt').write_text('\n\n'.join(selector), encoding='utf-8')
          Path('SPANISH_UNTRANSLATED_REPORT.txt').write_text('\n'.join(untranslated), encoding='utf-8')
      - name: Commit reports
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add LANGUAGE_SELECTOR_REPORT.txt SPANISH_UNTRANSLATED_REPORT.txt
          git commit -m "chore: report Spanish localization gaps" || exit 0
          git push
