name: Build Spanish APK
on:
  push:
    branches: [ spanish-translation ]
permissions:
  contents: write
jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spanish-translation
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply Spanish localization
        shell: python
        run: |
          from pathlib import Path
          import re
          t=Path('app/src/main/java/com/example/Translations.kt')
          s=t.read_text(encoding='utf-8')
          if 'translateDynamicSpanish' not in s:
              s=s.replace('    if (lang == "de") return de\n', '    if (lang == "de") return de\n    if (lang == "es") return translateDynamicSpanish(en)\n', 1)
              s=s.replace('        "zh" -> zh\n        else -> en', '        "zh" -> zh\n        "es" -> translateDynamicSpanish(en)\n        else -> en', 1)
              marker='private fun translateDynamicGeorgian'
              spanish='''private fun translateDynamicSpanish(en: String): String {\n    val exact = SPANISH_TRANSLATIONS[en]\n    if (exact != null) return exact\n    var s = en\n    val words = listOf(\n        "Habits" to "Hábitos", "Habit" to "Hábito", "Today" to "Hoy", "Yesterday" to "Ayer", "Tomorrow" to "Mañana",\n        "Profile" to "Perfil", "Stats" to "Estadísticas", "Statistics" to "Estadísticas", "Settings" to "Ajustes",\n        "Achievements" to "Logros", "Achievement" to "Logro", "Progress" to "Progreso", "Streak" to "Racha",\n        "Save" to "Guardar", "Cancel" to "Cancelar", "Delete" to "Eliminar", "Edit" to "Editar", "Add" to "Añadir",\n        "Done" to "Listo", "Next" to "Siguiente", "Back" to "Atrás", "Language" to "Idioma", "Appearance" to "Apariencia",\n        "Notifications" to "Notificaciones", "Reminder" to "Recordatorio", "Reminders" to "Recordatorios", "Daily" to "Diario",\n        "Weekly" to "Semanal", "Monthly" to "Mensual", "Yearly" to "Anual", "Calendar" to "Calendario", "History" to "Historial",\n        "Goal" to "Meta", "Goals" to "Metas", "Reward" to "Recompensa", "Rewards" to "Recompensas", "Timer" to "Temporizador",\n        "Notes" to "Notas", "Note" to "Nota", "Category" to "Categoría", "Name" to "Nombre", "Description" to "Descripción",\n        "Support" to "Soporte", "Email" to "Correo", "Search" to "Buscar", "Import" to "Importar", "Export" to "Exportar",\n        "Backup" to "Copia de seguridad", "Restore" to "Restaurar", "Active" to "Activo", "Archived" to "Archivado",\n        "Complete" to "Completar", "Completed" to "Completado", "Completions" to "Completados", "Days" to "Días", "Day" to "Día"\n    )\n    for ((a,b) in words) s=s.replace(a,b)\n    return s\n}\n\nval SPANISH_TRANSLATIONS: Map<String,String> = mapOf(\n    "Today" to "Hoy", "Profile" to "Perfil", "Stats" to "Estadísticas", "Habits" to "Hábitos",\n    "Habit Hero" to "Héroe de hábitos", "MY PROFILE" to "MI PERFIL", "Total Completions" to "Total completado",\n    "Total Check-ins" to "Total de registros", "Total Check-Ins" to "Total de registros", "Active Habits" to "Hábitos activos",\n    "Days Longest Streak" to "Días de la racha más larga", "MONTHLY REVIEW" to "RESUMEN MENSUAL", "YEAR IN REVIEW" to "RESUMEN ANUAL",\n    "Active Days" to "Días activos", "Top Habit" to "Mejor hábito", "Best Month" to "Mejor mes", "Best Streak" to "Mejor racha",\n    "Profile & Account" to "Perfil y cuenta", "Appearance & Language" to "Apariencia e idioma", "Notifications & Reviews" to "Notificaciones y resúmenes",\n    "Edit profile picture & name" to "Editar foto de perfil y nombre", "Haptic feedback & Archived habits" to "Vibración y hábitos archivados",\n    "Habit updated!" to "¡Hábito actualizado!", "Habit added!" to "¡Hábito añadido!", "Create a habit first to view statistics." to "Crea primero un hábito para ver las estadísticas.",\n    "Focus Audio Soundscapes" to "Sonidos para concentrarse", "Select & manage sounds" to "Seleccionar y administrar sonidos", "Search sound..." to "Buscar sonido...",\n    "No Sound (Mute)" to "Sin sonido (silencio)", "No matching audio files found." to "No se encontraron archivos de audio.",\n    "Import new audio (.mp3, .wav, .m4a)" to "Importar audio nuevo (.mp3, .wav, .m4a)", "Done" to "Listo",\n    "Delete" to "Eliminar", "Edit" to "Editar", "Save" to "Guardar", "Cancel" to "Cancelar", "Add" to "Añadir", "Next" to "Siguiente", "Back" to "Atrás",\n    "Language" to "Idioma", "Settings" to "Ajustes", "Statistics" to "Estadísticas", "Achievements" to "Logros", "Progress" to "Progreso", "Streak" to "Racha"\n)\n\n'''
              s=s.replace(marker, spanish+marker, 1)
              t.write_text(s,encoding='utf-8')
          vm=Path('app/src/main/java/com/example/ui/HabitsViewModel.kt')
          v=vm.read_text(encoding='utf-8')
          v=v.replace('sharedPrefs.getString("language", "en") ?: "en"','sharedPrefs.getString("language", "es") ?: "es"')
          v=v.replace('"zh" -> Locale.SIMPLIFIED_CHINESE\n                else -> Locale.US','"zh" -> Locale.SIMPLIFIED_CHINESE\n                "es" -> Locale.forLanguageTag("es")\n                else -> Locale.US')
          v=v.replace('"zh" -> "今天"\n                    else -> "Today"','"zh" -> "今天"\n                    "es" -> "Hoy"\n                    else -> "Today"')
          v=v.replace('"zh" -> "M月d日"\n                    else -> "MMMM d"','"zh" -> "M月d日"\n                    "es" -> "d \'de\' MMMM"\n                    else -> "MMMM d"')
          vm.write_text(v,encoding='utf-8')
          m=Path('app/src/main/java/com/example/MainActivity.kt')
          x=m.read_text(encoding='utf-8')
          # Add Spanish branch to compact language conditionals that fall back to a literal English string.
          pat=re.compile(r'(?P<prefix>if \(language == "de"\).*?else if \(language == "zh"\)\s*"(?:[^"\\]|\\.)*"\s*)else\s*"(?P<en>(?:[^"\\]|\\.)*)"')
          def repl(q):
              en=q.group('en')
              return q.group('prefix')+'else if (language == "es") tr("es", "", "'+en+'") else "'+en+'"'
          x=pat.sub(repl,x)
          # Make Spanish visible in common language-option list shapes when found.
          x=x.replace('"English" to "en"', '"English" to "en", "Español" to "es"')
          x=x.replace('Pair("English", "en")', 'Pair("English", "en"), Pair("Español", "es")')
          m.write_text(x,encoding='utf-8')
      - name: Commit localization
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/example/Translations.kt app/src/main/java/com/example/ui/HabitsViewModel.kt app/src/main/java/com/example/MainActivity.kt
          git commit -m "feat: add Spanish localization" || true
          git push || true
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: frequent-habits-spanish-apk
          path: app/build/outputs/apk/debug/*.apk
