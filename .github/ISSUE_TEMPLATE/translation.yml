name: 🌍 Sprachübersetzung
description: Neue Sprache vorschlagen oder Übersetzungsfehler melden
title: "[Translation]: "
labels: ["translation"]
body:
  - type: dropdown
    id: type
    attributes:
      label: Was möchtest du tun?
      options:
        - Neue Sprache hinzufügen
        - Fehler in bestehender Übersetzung melden
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Sprache
      placeholder: "z. B. Französisch (fr)"
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Bei Fehlermeldung bitte betroffenen String/Screen nennen
    validations:
      required: true
