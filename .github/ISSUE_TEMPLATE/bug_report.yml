name: 🐛 Bug Report
description: Melde einen Fehler in der App
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: App-Version
      placeholder: "z. B. 1.2.0"
    validations:
      required: true
  - type: dropdown
    id: android-version
    attributes:
      label: Android-Version
      options:
        - Android 15
        - Android 14
        - Android 13
        - Android 12
        - Älter
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: Was ist passiert?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Schritte zur Reproduktion
      placeholder: |
        1. ...
        2. ...
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: Ich habe geprüft, dass es noch kein offenes Issue dazu gibt
          required: true
